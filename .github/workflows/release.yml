name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to build and publish"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build - ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            args: ""
            rust_targets: x86_64-pc-windows-msvc
            bundle_dir: release
          - platform: macos
            os: macos-latest
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundle_dir: universal-apple-darwin/release

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@42e9df6634f4d2c58ca0d5f4ecfba32c8e9b6bb1 # v0.5.20
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          releaseName: "QR Code Generator __VERSION__"
          releaseBody: |
            Static QR codes that never expire, generated locally.

            The installer is not code signed yet, so Windows SmartScreen shows
            a warning on first run: choose "More info", then "Run anyway".
            macOS may need right-click, "Open" the first time.

            Verify your download against `SHA256SUMS-<platform>.txt`, which is
            the honest substitute for a signature until there is a certificate.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Checksums
        shell: bash
        run: |
          cd src-tauri/target/${{ matrix.bundle_dir }}/bundle
          find . -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' \) -print0 |
            xargs -0 -r shasum -a 256 > "$RUNNER_TEMP/SHA256SUMS-${{ matrix.platform }}.txt"
          cat "$RUNNER_TEMP/SHA256SUMS-${{ matrix.platform }}.txt"

      # Attached to the release itself, not just kept as a workflow artifact.
      # The release notes tell people to check their download against this
      # file, so it has to be next to the download rather than behind a login
      # on the Actions tab.
      - name: Attach checksums to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          gh release upload "$TAG" \
            "$RUNNER_TEMP/SHA256SUMS-${{ matrix.platform }}.txt" \
            --clobber --repo "$GITHUB_REPOSITORY"

      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: SHA256SUMS-${{ matrix.platform }}
          path: ${{ runner.temp }}/SHA256SUMS-${{ matrix.platform }}.txt
